name: gallery
description: "Examples gallery for graphic_lite"
publish_to: 'none' 

version: 0.3.0

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  collection: '>=1.19.0 <2.0.0'
  csv: '>=7.0.0 <8.0.0'
  date: 
    git: https://github.com/thumbert/date.git
  google_fonts: '>=8.0.2 <9.0.0'
  graphic: ^2.7.0
  http: ^1.6.0
  graphic_lite:
    path: ..
  signals_flutter: ^6.2.0
  syntax_highlight: ^0.5.0
  timezone: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - lib/examples/area_chart.dart
    - lib/examples/basic_bar_chart.dart
    - lib/examples/data_labels_on_hover.dart
    - lib/examples/grouped_bar_chart.dart
    - lib/examples/simple_scatter_plot.dart
    - lib/examples/simple_text_annotation.dart
    - lib/examples/stacked_bar_chart.dart



  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    # - family: Schyler
    #   fonts:
    #     - asset: fonts/Schyler-Regular.ttf
    #     - asset: fonts/Schyler-Italic.ttf
    #       style: italic
    - family: UbuntuMono
      fonts:
        - asset: assets/fonts/UbuntuMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/UbuntuMono-Bold.ttf
          weight: 700    
    # - family: Trajan Pro
    #   fonts:
    #     - asset: fonts/TrajanPro.ttf
    #     - asset: fonts/TrajanPro_Bold.ttf
    #       weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
